<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gamified Cyrillic Learning - Tasks & Alphabet</title>
    
    <!-- React & Babel -->
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.3/dist/umd/supabase.min.js"></script>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <style>
        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen',
                'Ubuntu', 'Cantarell', 'Fira Sans', 'Droid Sans', 'Helvetica Neue',
                sans-serif;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }
        
        /* Custom animations */
        @keyframes bounce {
            0%, 20%, 53%, 80%, 100% {
                transform: translate3d(0,0,0);
            }
            40%, 43% {
                transform: translate3d(0,-10px,0);
            }
            70% {
                transform: translate3d(0,-5px,0);
            }
            90% {
                transform: translate3d(0,-2px,0);
            }
        }
        .animate-bounce {
            animation: bounce 1s ease-in-out;
        }
        
        /* Gradient text effect */
        .gradient-text {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        /* Custom scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f1f1;
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb {
            background: #888;
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #555;
        }
    </style>
</head>
<body>
    <div id="root"></div>
    
    <script type="text/babel">
        // Replace these with your actual Supabase credentials
        const SUPABASE_URL = 'https://ohhgmkiwkyntanzgetxv.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9oaGdta2l3a3ludGFuemdldHh2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTg3MjQyMDIsImV4cCI6MjA3NDMwMDIwMn0.DcfhXBWwz788rEoiD2-350NrcmWcBcpzqJqmhFwf95Q';

        // Initialize Supabase client
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // Enhanced React components with authentication and todo features
        const { useState, useEffect, useRef } = React;

        // Authentication hook
        const useAuth = () => {
            const [user, setUser] = useState(null);
            const [loading, setLoading] = useState(true);

            useEffect(() => {
                // Get initial session
                supabase.auth.getSession().then(({ data: { session } }) => {
                    setUser(session?.user ?? null);
                    setLoading(false);
                });

                // Listen for auth changes
                const { data: { subscription } } = supabase.auth.onAuthStateChange(
                    async (event, session) => {
                        setUser(session?.user ?? null);
                        setLoading(false);
                    }
                );

                return () => subscription.unsubscribe();
            }, []);

            return { user, loading };
        };

        // User profile hook
        const useProfile = (user) => {
            const [profile, setProfile] = useState(null);
            const [loading, setLoading] = useState(false);

            useEffect(() => {
                if (user) {
                    loadProfile();
                }
            }, [user]);

            const loadProfile = async () => {
                setLoading(true);
                try {
                    const { data, error } = await supabase
                        .from('profiles')
                        .select('*')
                        .eq('user_id', user.id)
                        .single();

                    if (error && error.code !== 'PGRST116') {
                        console.error('Error loading profile:', error);
                    } else {
                        setProfile(data);
                    }
                } catch (error) {
                    console.error('Error loading profile:', error);
                } finally {
                    setLoading(false);
                }
            };

            return { profile, loading, refresh: loadProfile };
        };

        // XP and Level display component
        const UserStats = ({ profile }) => {
            if (!profile) return null;

            const xpForCurrentLevel = Math.pow(profile.level - 1, 2) * 100;
            const xpForNextLevel = Math.pow(profile.level, 2) * 100;
            const xpProgress = profile.total_xp - xpForCurrentLevel;
            const xpNeeded = xpForNextLevel - xpForCurrentLevel;
            const progressPercentage = Math.min(100, (xpProgress / xpNeeded) * 100);

            return React.createElement('div', {
                className: "bg-gradient-to-r from-purple-600 to-blue-600 text-white p-6 rounded-xl mb-6 shadow-lg"
            },
                React.createElement('div', { className: "flex items-center justify-between mb-4" },
                    React.createElement('div', { className: "flex items-center gap-4" },
                        React.createElement('div', { className: "w-16 h-16 bg-white/20 rounded-full flex items-center justify-center text-3xl" }, 
                            '👤'
                        ),
                        React.createElement('div', null,
                            React.createElement('h3', { className: "font-bold text-2xl mb-1" }, 
                                profile.display_name || 'Player'
                            ),
                            React.createElement('p', { className: "text-lg opacity-90" }, 
                                `Level ${profile.level}`
                            )
                        )
                    ),
                    React.createElement('div', { className: "text-right" },
                        React.createElement('div', { className: "text-3xl font-bold mb-1" }, 
                            `${profile.total_xp.toLocaleString()}`
                        ),
                        React.createElement('div', { className: "text-sm opacity-90" }, 'Total XP'),
                        React.createElement('div', { className: "text-lg mt-2" }, 
                            `🔥 ${profile.current_streak} day streak`
                        )
                    )
                ),
                React.createElement('div', { className: "mb-2" },
                    React.createElement('div', { className: "flex justify-between text-sm mb-1" },
                        React.createElement('span', null, 'Progress to next level'),
                        React.createElement('span', null, `${xpProgress}/${xpNeeded} XP`)
                    ),
                    React.createElement('div', { className: "w-full bg-white/20 rounded-full h-3" },
                        React.createElement('div', {
                            className: "bg-gradient-to-r from-yellow-400 to-orange-400 h-3 rounded-full transition-all duration-500 ease-out",
                            style: { width: `${progressPercentage}%` }
                        })
                    )
                )
            );
        };

        // Authentication component
        const AuthComponent = () => {
            const [isSignUp, setIsSignUp] = useState(false);
            const [email, setEmail] = useState('');
            const [password, setPassword] = useState('');
            const [displayName, setDisplayName] = useState('');
            const [loading, setLoading] = useState(false);
            const [message, setMessage] = useState('');

            const handleAuth = async (e) => {
                e.preventDefault();
                setLoading(true);
                setMessage('');

                try {
                    if (isSignUp) {
                        const { data, error } = await supabase.auth.signUp({
                            email,
                            password,
                            options: {
                                data: {
                                    display_name: displayName || email.split('@')[0]
                                }
                            }
                        });
                        
                        if (error) throw error;
                        
                        setMessage('Success! Check your email for the confirmation link.');
                    } else {
                        const { data, error } = await supabase.auth.signInWithPassword({
                            email,
                            password
                        });
                        
                        if (error) throw error;
                    }
                } catch (error) {
                    setMessage(error.message);
                } finally {
                    setLoading(false);
                }
            };

            return React.createElement('div', {
                className: "max-w-md mx-auto bg-white rounded-2xl shadow-xl p-8"
            },
                React.createElement('div', { className: "text-center mb-8" },
                    React.createElement('div', { className: "text-6xl mb-4" }, '🎓'),
                    React.createElement('h1', { className: "text-3xl font-bold text-gray-800 mb-2 gradient-text" },
                        'Gamified Learning'
                    ),
                    React.createElement('p', { className: "text-lg text-gray-600 mb-4" },
                        isSignUp ? 'Create your account' : 'Welcome back!'
                    ),
                    React.createElement('p', { className: "text-sm text-gray-500" },
                        'Learn Cyrillic • Complete Tasks • Earn XP'
                    )
                ),
                React.createElement('form', { onSubmit: handleAuth, className: "space-y-6" },
                    isSignUp && React.createElement('div', null,
                        React.createElement('label', { className: "block text-sm font-semibold text-gray-700 mb-2" },
                            'Display Name'
                        ),
                        React.createElement('input', {
                            type: 'text',
                            value: displayName,
                            onChange: (e) => setDisplayName(e.target.value),
                            placeholder: 'Enter your name',
                            className: "w-full px-4 py-3 border border-gray-300 rounded-xl focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all"
                        })
                    ),
                    React.createElement('div', null,
                        React.createElement('label', { className: "block text-sm font-semibold text-gray-700 mb-2" },
                            'Email Address'
                        ),
                        React.createElement('input', {
                            type: 'email',
                            value: email,
                            onChange: (e) => setEmail(e.target.value),
                            placeholder: 'Enter your email',
                            className: "w-full px-4 py-3 border border-gray-300 rounded-xl focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all",
                            required: true
                        })
                    ),
                    React.createElement('div', null,
                        React.createElement('label', { className: "block text-sm font-semibold text-gray-700 mb-2" },
                            'Password'
                        ),
                        React.createElement('input', {
                            type: 'password',
                            value: password,
                            onChange: (e) => setPassword(e.target.value),
                            placeholder: 'Enter your password',
                            className: "w-full px-4 py-3 border border-gray-300 rounded-xl focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all",
                            required: true,
                            minLength: 6
                        })
                    ),
                    React.createElement('button', {
                        type: 'submit',
                        disabled: loading,
                        className: "w-full py-4 px-6 bg-gradient-to-r from-blue-600 to-purple-600 text-white rounded-xl font-bold text-lg hover:from-blue-700 hover:to-purple-700 transition-all transform hover:scale-105 disabled:opacity-50 disabled:transform-none shadow-lg"
                    }, loading ? 'Loading...' : (isSignUp ? 'Create Account' : 'Sign In'))
                ),
                message && React.createElement('div', {
                    className: `mt-6 p-4 rounded-xl text-sm font-medium ${message.includes('Success') || message.includes('Check') ? 'bg-green-100 text-green-800' : 'bg-red-100 text-red-800'}`
                }, message),
                React.createElement('div', { className: "mt-8 text-center" },
                    React.createElement('button', {
                        onClick: () => {
                            setIsSignUp(!isSignUp);
                            setMessage('');
                        },
                        className: "text-blue-600 hover:text-blue-800 font-medium transition-colors"
                    }, isSignUp ? 'Already have an account? Sign in' : "Don't have an account? Sign up")
                )
            );
        };

        // Main App Component  
        const GamifiedLearningApp = () => {
            const { user, loading: authLoading } = useAuth();
            const { profile, loading: profileLoading, refresh: refreshProfile } = useProfile(user);
            const [activeTab, setActiveTab] = useState('learn');
            const [xpNotification, setXpNotification] = useState(null);

            // Check if Supabase is properly configured
            const isConfigured = SUPABASE_URL !== 'https://your-project.supabase.co' && 
                               SUPABASE_ANON_KEY !== 'your-anon-key-here';

            const handleXPEarned = (amount, message) => {
                setXpNotification({ amount, message });
                refreshProfile(); // Refresh to get updated XP/level
            };

            const signOut = async () => {
                await supabase.auth.signOut();
            };

            if (authLoading) {
                return React.createElement('div', { 
                    className: "min-h-screen bg-gradient-to-br from-blue-50 to-purple-50 flex items-center justify-center" 
                },
                    React.createElement('div', { className: "text-center" },
                        React.createElement('div', { className: "text-6xl mb-4 animate-bounce" }, '🎓'),
                        React.createElement('div', { className: "text-2xl font-semibold text-gray-600" }, 'Loading...')
                    )
                );
            }

            if (!isConfigured) {
                return React.createElement('div', { 
                    className: "min-h-screen bg-gradient-to-br from-blue-50 to-purple-50 flex items-center justify-center p-4" 
                },
                    React.createElement('div', { className: "max-w-2xl mx-auto bg-white rounded-2xl shadow-xl p-8 text-center" },
                        React.createElement('div', { className: "text-6xl mb-6" }, '🔧'),
                        React.createElement('h1', { className: "text-3xl font-bold text-gray-800 mb-4" },
                            'Setup Required'
                        ),
                        React.createElement('p', { className: "text-lg text-gray-600 mb-6" },
                            'To enable the full gamified experience, you need to configure Supabase:'
                        ),
                        React.createElement('div', { className: "bg-gray-100 rounded-xl p-6 mb-6 text-left" },
                            React.createElement('h3', { className: "font-bold text-lg mb-3" }, 'Quick Setup Steps:'),
                            React.createElement('ol', { className: "list-decimal list-inside space-y-2 text-gray-700" },
                                React.createElement('li', null, 'Create a Supabase project at supabase.com'),
                                React.createElement('li', null, 'Run the SQL schema from database/schema.sql'),
                                React.createElement('li', null, 'Replace SUPABASE_URL and SUPABASE_ANON_KEY in this HTML file'),
                                React.createElement('li', null, 'Redeploy your site')
                            )
                        ),
                        React.createElement('p', { className: "text-sm text-gray-500 mb-6" },
                            'See SETUP.md for detailed instructions'
                        ),
                        React.createElement('div', { className: "space-y-4" },
                            React.createElement('a', {
                                href: 'https://supabase.com',
                                target: '_blank',
                                className: "inline-block px-6 py-3 bg-green-600 text-white rounded-xl font-semibold hover:bg-green-700 transition-colors"
                            }, 'Get Started with Supabase →'),
                            React.createElement('div', null,
                                React.createElement('button', {
                                    onClick: () => window.location.reload(),
                                    className: "px-6 py-3 bg-blue-600 text-white rounded-xl font-semibold hover:bg-blue-700 transition-colors"
                                }, 'Continue in Demo Mode')
                            )
                        )
                    )
                );
            }

            if (!user) {
                return React.createElement('div', { 
                    className: "min-h-screen bg-gradient-to-br from-blue-50 to-purple-50 flex items-center justify-center p-4" 
                },
                    React.createElement(AuthComponent)
                );
            }

            return React.createElement('div', { className: "min-h-screen bg-gradient-to-br from-blue-50 to-purple-50 p-4" },
                // XP Notification
                xpNotification && React.createElement('div', {
                    className: "fixed top-4 right-4 bg-gradient-to-r from-green-500 to-blue-500 text-white px-6 py-4 rounded-xl shadow-lg transform transition-transform animate-bounce z-50",
                    onClick: () => setXpNotification(null)
                },
                    React.createElement('div', { className: "flex items-center gap-3" },
                        React.createElement('span', { className: "text-3xl" }, '✨'),
                        React.createElement('div', null,
                            React.createElement('div', { className: "font-bold text-lg" }, `+${xpNotification.amount} XP`),
                            React.createElement('div', { className: "text-sm opacity-90" }, xpNotification.message)
                        )
                    )
                ),
                
                React.createElement('div', { className: "max-w-5xl mx-auto" },
                    // Header with user stats and sign out
                    React.createElement('div', { className: "flex justify-between items-start mb-8" },
                        React.createElement('div', null,
                            React.createElement('h1', { className: "text-5xl font-bold gradient-text mb-2" }, 
                                'Gamified Learning'
                            ),
                            React.createElement('p', { className: "text-xl text-gray-600" },
                                'Master Cyrillic • Complete Tasks • Level Up! 🚀'
                            )
                        ),
                        React.createElement('button', {
                            onClick: signOut,
                            className: "px-6 py-3 bg-gray-600 text-white rounded-xl font-semibold hover:bg-gray-700 transition-colors shadow-lg"
                        }, 'Sign Out')
                    ),
                    
                    // User Stats
                    !profileLoading && profile && React.createElement(UserStats, { profile }),
                    
                    // Navigation Tabs
                    React.createElement('div', { className: "flex bg-white rounded-2xl p-2 shadow-xl mb-8" },
                        [
                            { id: 'learn', label: '📚 Learn Cyrillic', desc: 'Master the alphabet' },
                            { id: 'tasks', label: '✅ Tasks & Goals', desc: 'Earn XP & level up' }
                        ].map(tab => 
                            React.createElement('button', {
                                key: tab.id,
                                onClick: () => setActiveTab(tab.id),
                                className: `flex-1 py-4 px-6 rounded-xl font-bold transition-all ${
                                    activeTab === tab.id 
                                        ? 'bg-gradient-to-r from-blue-600 to-purple-600 text-white shadow-lg transform scale-105' 
                                        : 'text-gray-600 hover:text-blue-600 hover:bg-blue-50'
                                }`
                            },
                                React.createElement('div', { className: "text-lg" }, tab.label),
                                React.createElement('div', { className: `text-sm ${activeTab === tab.id ? 'opacity-90' : 'opacity-60'}` }, tab.desc)
                            )
                        )
                    ),
                    
                    // Content placeholder - Enhanced components will go here
                    activeTab === 'learn' && React.createElement('div', { 
                        className: "bg-white rounded-2xl shadow-xl p-8 text-center" 
                    },
                        React.createElement('h2', { className: "text-3xl font-bold text-gray-800 mb-4" },
                            'Cyrillic Alphabet Game'
                        ),
                        React.createElement('p', { className: "text-lg text-gray-600 mb-8" },
                            'Enhanced learning experience with XP rewards!'
                        ),
                        React.createElement('div', { className: "text-8xl mb-6" }, '🔤'),
                        React.createElement('div', { className: "bg-blue-50 rounded-xl p-6 mb-6" },
                            React.createElement('p', { className: "text-blue-800 font-medium mb-2" }, 
                                '🎯 Game Features:'
                            ),
                            React.createElement('ul', { className: "text-sm text-blue-700 space-y-1" },
                                React.createElement('li', null, '• Interactive alphabet learning with audio'),
                                React.createElement('li', null, '• Quiz mode with XP rewards'),
                                React.createElement('li', null, '• Progress tracking and achievements'),
                                React.createElement('li', null, '• Perfect score bonuses')
                            )
                        ),
                        React.createElement('p', { className: "text-gray-500" },
                            'Full game integration available once you complete the setup steps above.'
                        )
                    ),
                    
                    activeTab === 'tasks' && React.createElement('div', { 
                        className: "bg-white rounded-2xl shadow-xl p-8 text-center" 
                    },
                        React.createElement('h2', { className: "text-3xl font-bold text-gray-800 mb-4" },
                            'Tasks & Goals System'
                        ),
                        React.createElement('p', { className: "text-lg text-gray-600 mb-8" },
                            'Complete tasks to earn XP and level up your learning journey!'
                        ),
                        React.createElement('div', { className: "text-8xl mb-6" }, '📋'),
                        React.createElement('div', { className: "bg-green-50 rounded-xl p-6 mb-6" },
                            React.createElement('p', { className: "text-green-800 font-medium mb-2" }, 
                                '✨ Todo Features:'
                            ),
                            React.createElement('ul', { className: "text-sm text-green-700 space-y-1" },
                                React.createElement('li', null, '• Create and complete tasks for XP'),
                                React.createElement('li', null, '• Build habits with recurring rewards'),
                                React.createElement('li', null, '• Organize with projects and tags'),
                                React.createElement('li', null, '• Unlock achievements and badges'),
                                React.createElement('li', null, '• Track daily streaks and progress')
                            )
                        ),
                        React.createElement('p', { className: "text-gray-500" },
                            'Full gamified todo system available once Supabase is configured.'
                        )
                    )
                )
            );
        };

        // Initialize the app
        ReactDOM.render(React.createElement(GamifiedLearningApp), document.getElementById('root'));
    </script>
</body>
</html>
